version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcriptor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcriptor}
      POSTGRES_DB: ${POSTGRES_DB:-transcriptor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcriptor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-transcriptor}:${POSTGRES_PASSWORD:-transcriptor}@postgres:5432/${POSTGRES_DB:-transcriptor}
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/root/.cache/huggingface

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"

volumes:
  postgres_data:
  whisper_cache:
